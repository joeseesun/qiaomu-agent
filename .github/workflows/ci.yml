name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check release workspace and version consistency
        run: npm run release:preflight

      - name: Typecheck, test, and build
        run: npm run check

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v7
        with:
          name: qiaomu-agent-${{ github.sha }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Windows CLI resolution and literal argument round trips
        run: npx vitest run tests/cli-process.test.ts tests/cli-process-windows.test.ts tests/cli-discovery.test.ts tests/json-rpc-process.test.ts
